name: P2.7 one-off genuine JBIG2 codec acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p2-7-jbig2-acceptance.yml

permissions:
  contents: read

jobs:
  jbig2-codecs:
    if: github.head_ref == 'feat/p2-7-codec-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: "true"
      P2_7_EXPECT_JBIG2: "jbig2-mmr,jbig2-customat,jbig2-halftone"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install pinned application dependencies
        run: npm ci --no-audit --no-fund
      - name: Fetch license-attributed JBIG2 corpus at immutable source commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("/tmp/p27-jbig2")
          root.mkdir(parents=True, exist_ok=True)
          # Original JBIG2 test streams: Nico Weber / SerenityOS, BSD-2-Clause.
          # These thin PDF wrappers are from mozilla/pdf.js test/pdfs.
          commit = "0a4153349dc473ba950fc17941c5ca7eda43c1de"
          records = [
            ("jbig2-mmr", "bitmap-mmr.pdf", "b7099a499822fff95d90b9bdc006157242a1b912"),
            ("jbig2-customat", "bitmap-customat.pdf", "b18bc21793a85179c445db8ef42a33a5ee2b4407"),
            ("jbig2-halftone", "bitmap-halftone.pdf", "b05df7f1c590d3819382dbef7fa73857bb26d59e"),
          ]
          cases = []
          for ident, name, git_blob in records:
            dest = root / name
            url = "https://raw.githubusercontent.com/mozilla/pdf.js/" + commit + "/test/pdfs/" + name
            subprocess.run(["curl","--fail","--location","--retry","3","--connect-timeout","20",
              "--max-time","90","--silent","--show-error","--output",str(dest),url],check=True)
            data = dest.read_bytes()
            if not 100 <= len(data) <= 10_000 or not data.startswith(b"%PDF-"):
              raise ValueError("Not a pinned small test PDF: " + ident)
            if b"/JBIG2Decode" not in data:
              raise ValueError("Real JBIG2Decode filter missing: " + ident)
            actual_git_blob = subprocess.check_output(["git","hash-object",str(dest)],text=True).strip()
            if actual_git_blob != git_blob:
              raise ValueError("Git blob hash mismatch: " + ident)
            sha256 = hashlib.sha256(data).hexdigest()
            print("P2_7_JBIG2_SOURCE " + json.dumps(
              {"id":ident,"bytes":len(data),"gitBlob":actual_git_blob,"sha256":sha256}))
            cases.append({"id":ident,"path":str(dest),"sha256":sha256})
          with open(os.environ["GITHUB_ENV"],"a",encoding="utf8") as f:
            f.write("P2_7_JBIG2_FILES=" + json.dumps(cases,separators=(",",":")) + "\n")
          PY
      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Build production viewer and decoder assets
        run: |
          npm run build
          node scripts/check-pages.mjs
      - name: Check actual JBIG2 MMR, arithmetic and halftone pixels in Chromium
        run: npm run test:codec:browser
      - name: Verify complete codec and JBIG2 evidence
        run: node scripts/verify-p2-7-codecs.mjs
      - name: Archive only JSON evidence, never third-party source PDF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-7-jbig2-acceptance-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: test-results/stress/p2-7-*.json
