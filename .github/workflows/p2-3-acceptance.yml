name: P2.3 one-off full acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p2-3-acceptance.yml

permissions:
  contents: read

concurrency:
  group: p2-3-once-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  full-acceptance:
    if: github.head_ref == 'test/p2-3-full-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      P2_STRESS_PROFILE: full
      P2_STRESS_PAGES: "100,1000,5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run all unit/regression tests
        run: npm test
      - name: Run 20 workspaces / 1900 links and 100/1000/5000-page PDF.js model stress
        shell: bash
        run: |
          mkdir -p test-results/stress
          set -o pipefail
          npm run test:stress:model 2>&1 | tee test-results/stress/model.log
      - name: Install pinned Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium and dependencies
        run: npx playwright install --with-deps chromium
      - name: Verify production build
        run: npm run build
      - name: Verify GitHub Pages asset paths
        run: node scripts/check-pages.mjs
      - name: Run full 100/1000/5000-page capacity and workspace browser tests
        run: npm run test:stress:capacity
      - name: Run full 100/1000/5000-page search and navigation browser baselines
        if: success() || failure()
        run: npm run test:stress:browser
      - name: Summarize capacity metrics
        if: always()
        run: node scripts/p2-stress-summary.mjs
      - name: Summarize search/navigation metrics
        if: always()
        run: npm run test:stress:report
      - name: Verify all full-profile evidence and metrics are present
        run: node scripts/verify-p2-3.mjs
      - name: Upload full acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-3-full-acceptance-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
          retention-days: 30
