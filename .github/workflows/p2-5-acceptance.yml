name: P2.5 temporary full raster acceptance
# Use on-disk Playwright upload for fixtures over 50 MiB.

on:
  pull_request:
    # Final baseline also samples Chromium process PSS/RSS.
    branches: [main]
    paths:
      - .github/workflows/p2-5-acceptance.yml

permissions:
  contents: read

jobs:
  raster-acceptance:
    if: github.head_ref == 'test/p2-5-image-memory-acceptance'
    runs-on: ubuntu-latest
    timeout-minutes: 105
    env:
      CI: "true"
      P2_STRESS_PROFILE: full
      P2_STRESS_PAGES: "100,1000,5000"
      P2_IMAGE_PROFILE: full
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit, image operator and reproducibility tests
        run: npm test
      - name: Model and 1900 linked pages
        shell: bash
        run: |
          mkdir -p test-results/stress
          set -o pipefail
          npm run test:stress:model 2>&1 | tee test-results/stress/model.log
      - name: Install Playwright
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Build release
        run: npm run build
      - name: Verify Pages paths
        run: node scripts/check-pages.mjs
      - name: Full text/raster/desktop/mobile Chromium acceptance
        run: npm run test:stress:capacity
      - name: Full navigation and search baselines
        if: success() || failure()
        run: npm run test:stress:browser
      - name: Capacity summary
        if: always()
        run: node scripts/p2-stress-summary.mjs
      - name: Search summary
        if: always()
        run: npm run test:stress:report
      - name: Validate P2.3/4 evidence
        run: node scripts/verify-p2-3.mjs
      - name: Validate image-based and mobile evidence
        run: node scripts/verify-p2-5.mjs
      - name: Archive evidence, not source PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-5-raster-acceptance-${{ github.run_id }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            test-results/
            playwright-report/
