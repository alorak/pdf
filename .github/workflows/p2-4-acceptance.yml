name: P2.4 temporary full performance acceptance
# Re-run complete evidence verification after virtual DOM assertions were updated.

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p2-4-acceptance.yml

permissions:
  contents: read

jobs:
  performance:
    if: github.head_ref == 'feat/p2-4-windowed-pages-search'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      P2_STRESS_PROFILE: full
      P2_STRESS_PAGES: "100,1000,5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit and regression checks
        run: npm test
      - name: Model, 1900 links, real PDF.js documents
        shell: bash
        run: |
          mkdir -p test-results/stress
          set -o pipefail
          npm run test:stress:model 2>&1 | tee test-results/stress/model.log
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: node scripts/check-pages.mjs
      - name: Chromium 100/1000/5000 capacity and P2.4 window navigation
        run: npm run test:stress:capacity
      - name: Chromium 100/1000/5000 search/navigation baseline
        if: success() || failure()
        run: npm run test:stress:browser
      - name: Capacity summary
        if: always()
        run: node scripts/p2-stress-summary.mjs
      - name: Search summary
        if: always()
        run: npm run test:stress:report
      - name: Verify all model, search, window and JSON report evidence
        run: node scripts/verify-p2-3.mjs
      - name: Archive P2.4 full evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-4-full-baseline-${{ github.run_id }}
          path: |
            test-results/
            playwright-report/
          retention-days: 30
          if-no-files-found: warn
