name: Validate PDF viewer pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Workspace, migration and backup tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: GitHub Pages asset verification
        run: node scripts/check-pages.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright runner without modifying lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: PDF reader Chromium E2E
        run: npx playwright test
      - name: Small-fixture stress baseline (100 pages and 20-workspace capacity)
        env:
          P2_STRESS_PAGES: "100"
        run: npx playwright test --config playwright.stress.config.mjs
      - name: Summarize PR stress metrics
        if: always()
        run: node scripts/p2-stress-summary.mjs
      - name: Upload PR stress baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-pr-baseline
          path: |
            test-results/stress/
            test-results/p2-summary.md
          if-no-files-found: ignore
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
