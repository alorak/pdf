name: Validate PDF viewer pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Generate PDF export dependency lockfile for review
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e 'const s=require("fs").readFileSync("package-lock.json").toString("base64"); for(let i=0;i<s.length;i+=2000) console.log("LOCKSEG"+String(i/2000).padStart(3,"0")+"="+s.slice(i,i+2000))'
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Workspace, migration and backup tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: GitHub Pages asset verification
        run: node scripts/check-pages.mjs

  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright runner without modifying lockfile
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium and browser dependencies
        run: npx playwright install --with-deps chromium
      - name: PDF reader Chromium E2E
        run: npx playwright test
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
