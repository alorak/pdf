name: Validate PDF viewer pull request

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Workspace, migration and backup tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: GitHub Pages asset verification
        run: node scripts/check-pages.mjs
