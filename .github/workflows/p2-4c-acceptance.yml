name: P2.4-C one-off 5000-page acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/p2-4c-acceptance.yml

permissions:
  contents: read

jobs:
  full-acceptance:
    if: github.head_ref == 'feat/p2-4c-thumbnail-window'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      P2_STRESS_PROFILE: full
      P2_STRESS_PAGES: "100,1000,5000"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Locked dependency installation
        run: npm ci --no-audit --no-fund
      - name: All unit / regression tests
        run: npm test
      - name: Full model stress with 1900-linked-page evidence
        shell: bash
        run: |
          mkdir -p test-results/stress
          set -o pipefail
          npm run test:stress:model 2>&1 | tee test-results/stress/model.log
      - name: Install pinned Playwright runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium dependencies
        run: npx playwright install --with-deps chromium
      - name: Build app
        run: npm run build
      - name: Check Pages URLs
        run: node scripts/check-pages.mjs
      - name: Full 100/1000/5000 capacity, horizontal and thumbnail scenarios
        run: npm run test:stress:capacity
      - name: Full 100/1000/5000 search, navigation, render metrics
        if: success() || failure()
        run: npm run test:stress:browser
      - name: Capacity summary
        if: always()
        run: node scripts/p2-stress-summary.mjs
      - name: Search summary
        if: always()
        run: npm run test:stress:report
      - name: Confirm model, thumbnail and DOM evidence integrity
        run: node scripts/verify-p2-3.mjs
      - name: Archive benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p2-4c-full-evidence-${{ github.run_id }}
          retention-days: 30
          path: |
            test-results/
            playwright-report/
          if-no-files-found: warn
